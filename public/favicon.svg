<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1926" />
      <stop offset="50%" stop-color="#102538" />
      <stop offset="100%" stop-color="#07121c" />
    </linearGradient>

    <!-- IDSS Gradient (Blue to Red to Cyan) -->
    <linearGradient id="idssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08ABE6" />
      <stop offset="45%" stop-color="#035EA1" />
      <stop offset="100%" stop-color="#E8262C" />
    </linearGradient>

    <!-- IMH Gradient (Green to Lime) -->
    <linearGradient id="imhGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e8237" />
      <stop offset="60%" stop-color="#2CB14D" />
      <stop offset="100%" stop-color="#D8E155" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="60%" stop-color="#FFCB29" />
      <stop offset="100%" stop-color="#E6A800" />
    </linearGradient>

    <!-- Subtle Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#08abe6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Badge with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- Multi-color Institutional Accent Arc (Top-Right IDSS Red, Bottom-Left IMH Green, Gold Apex) -->
  <path d="M 12 18 C 12 10, 20 6, 32 6 C 44 6, 52 10, 52 18" fill="none" stroke="url(#idssGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="6" r="2.5" fill="url(#goldGrad)" />

  <!-- Central Emblem: House of Knowledge (Buka 11/13) -->
  <!-- Left Side: Montessori Tree of Life & Growth (IMH) -->
  <g filter="url(#glow)">
    <!-- Montessori Sprout / Nurturing Leaves -->
    <path d="M 32 46 C 30 38, 20 37, 16 32 C 12 27, 17 21, 23 23 C 27 24, 29 28, 32 35 Z" fill="url(#imhGrad)" />
    <path d="M 32 36 C 28 30, 20 28, 19 22 C 18 17, 25 15, 29 19 C 31 22, 31 26, 32 30 Z" fill="#D8E155" opacity="0.9" />

    <!-- Right Side: German-International Wings / Open Book of Science (IDSS) -->
    <path d="M 32 46 C 34 38, 44 37, 48 32 C 52 27, 47 21, 41 23 C 37 24, 35 28, 32 35 Z" fill="url(#idssGrad)" />
    <path d="M 32 36 C 36 30, 44 28, 45 22 C 46 17, 39 15, 35 19 C 33 22, 33 26, 32 30 Z" fill="#08ABE6" opacity="0.95" />

    <!-- Center Spire & Foundation Stem (The Continuum from Toddler to Grade 9) -->
    <path d="M 32 15 L 34 23 L 32 47 L 30 23 Z" fill="url(#goldGrad)" />
    <circle cx="32" cy="14" r="3.2" fill="url(#goldGrad)" stroke="#102538" stroke-width="1" />
  </g>

  <!-- Micro Emblem Bottom Acronyms -->
  <rect x="18" y="50" width="12" height="3" rx="1.5" fill="#2CB14D" />
  <rect x="34" y="50" width="12" height="3" rx="1.5" fill="#E8262C" />
</svg>
